services:
  api:
    build: .
    container_name: fastapi_app
    restart: always
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: recruit_AI
    depends_on:
      - db

  db:
    image: mysql:8
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: recruit_AI
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./create_database.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  db_data:
